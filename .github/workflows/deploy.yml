name: Deploy Web
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Prepare static site
      run: |
        mkdir -p release
        rsync -a --exclude='.git' --exclude='.github' --exclude='release' ./ release/
        cp release/index.html release/404.html
        touch release/.nojekyll
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: release
